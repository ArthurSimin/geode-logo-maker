<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Geode Logo Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Design tokens (Geode palette) + base reset */
:root {
  --bg: #0c0811;
  --p: #191023;
  --p2: #322145;
  --bd: #4b3168;
  --tx: #f2f2f2;
  --mu: #b197ce;
  --ac: #ed8678;
  --btn: #160503;
  color-scheme: dark;
  box-sizing: border-box;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
}
body {
  height: 100dvh;
  background: var(--bg);
  color: var(--tx);
  font:
    14px Poppins,
    system-ui,
    sans-serif;
  display: grid;
  grid-template-rows: 84px 1fr 40px;
  overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
h3,
.brand {
  font-family: Quicksand, Poppins, sans-serif;
}
/* Buttons: same look as the Geode website nav buttons */
button {
  font: inherit;
  background: var(--btn);
  color: var(--ac);
  border: 2px solid var(--btn);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 4px 6px -1px #0003,
    0 2px 4px -2px #0003;
  transition:
    color 0.15s,
    background-color 0.15s,
    border-color 0.15s;
  user-select: none;
}
button:hover,
button.pr:hover {
  background: #fcebe9;
  border-color: #fcebe9;
  color: #11080f;
}
button:disabled {
  opacity: 0.35;
  pointer-events: none;
  transform: none;
}
button.pr {
  background: var(--ac);
  border-color: var(--ac);
  color: var(--btn);
}
button.on {
  background: #cd98bd;
  border-color: #cd98bd;
  color: #11080f;
}
/* Header: animated Geode waves, brand and actions */
header {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px 8px;
  overflow: hidden;
  z-index: 1;
}
.hw {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 25px;
  margin-right: 12px;
  color: #f2f2f2;
  text-shadow: 0 2px 8px #0005;
}
.brand b {
  font-weight: 700;
}
.brand span {
  font-weight: 500;
}
.sp {
  flex: 1;
}
header .ck {
  background: var(--btn);
  color: var(--ac);
  padding: 7px 12px;
  border-radius: 6px;
  margin: 0;
  box-shadow: 0 4px 6px -1px #0003;
}
.ck {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--mu);
  cursor: pointer;
  margin: 0 6px;
}
.ck input {
  accent-color: var(--ac);
}
/* Layout: toolbar | workspace | side panel */
main {
  display: grid;
  grid-template-columns: 58px 1fr 312px;
  min-height: 0;
}
#tl {
  background: var(--p);
  border-right: 1px solid var(--p2);
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  align-items: center;
}
#tl button {
  width: 42px;
  height: 42px;
  padding: 0;
}
#tl hr {
  width: 26px;
  border: 0;
  border-top: 1px solid var(--p2);
  margin: 2px 0;
}
/* Workspace: stack of svg frame (#fr), layers canvas (#cv) and overlay (#ov) */
#ws {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  touch-action: none;
}
.wbg {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 42%;
  opacity: 0.14;
  pointer-events: none;
}
#cv,
#fr {
  position: absolute;
  animation: cvin 0.8s var(--ease) backwards;
}
#fr {
  box-shadow:
    0 0 0 1px #000,
    0 8px 40px #000a;
  background: conic-gradient(
      #3b3b3b 25%,
      #2c2c2c 0 50%,
      #3b3b3b 0 75%,
      #2c2c2c 0
    )
    0 0/24px 24px;
}
#ov {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
#em {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 64px;
  text-align: center;
  color: var(--mu);
  pointer-events: none;
}
#em[hidden] {
  display: none;
}
.zc {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: var(--p);
  padding: 5px;
  border-radius: 8px;
  border: 1px solid var(--p2);
}
.zc button {
  padding: 4px 9px;
}
#zl {
  min-width: 50px;
  text-align: center;
  align-self: center;
  color: var(--mu);
}
/* Side panel: layers list + properties */
aside {
  background: var(--p);
  border-left: 1px solid var(--p2);
  display: grid;
  grid-template-rows: minmax(120px, 38%) 1fr;
  min-height: 0;
}
aside > section {
  overflow: auto;
  padding: 12px 14px;
  overflow-x: hidden;
}
aside > section + section {
  border-top: 1px solid var(--p2);
}
h3 {
  margin: 14px 0 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ac);
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
h3:first-child {
  margin-top: 0;
}
/* Layer rows */
.ly {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px;
  border-radius: 6px;
  margin-bottom: 4px;
  background: var(--p2);
  border: 2px solid transparent;
  cursor: pointer;
  transition:
    transform 0.28s var(--spring),
    background-color 0.2s,
    border-color 0.2s,
    box-shadow 0.25s;
}
.ly:hover {
  background: #3d2a54;
}
.ly.on {
  border-color: var(--ac);
  box-shadow: 0 8px 22px -10px #ed8678aa;
}
.ly.dt {
  box-shadow: 0 -2px 0 var(--ac);
}
.ly img,
.bgs {
  width: 30px;
  height: 30px;
  border-radius: 5px;
  object-fit: contain;
  background: conic-gradient(#555 25%, #3a3a3a 0 50%, #555 0 75%, #3a3a3a 0) 0
    0/10px 10px;
  flex: none;
}
.nm {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  outline: 0;
}
.nm[contenteditable="true"] {
  background: #0006;
  padding: 2px 4px;
  border-radius: 4px;
  text-overflow: clip;
}
.ib {
  padding: 3px;
  background: none;
  border-color: transparent;
  box-shadow: none;
  color: var(--mu);
}
.ib:hover {
  background: var(--bd);
  border-color: var(--bd);
  color: #fff;
}
.ib.off {
  color: #6b5a80;
}
/* Form controls */
.r {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
}
.r span {
  width: 78px;
  color: var(--mu);
}
.r input[type="range"] {
  flex: 1;
  accent-color: var(--ac);
  min-width: 0;
}
.r output {
  width: 38px;
  text-align: right;
  color: var(--mu);
}
.g2,
.g3 {
  display: grid;
  gap: 6px;
}
.g2 {
  grid-template-columns: 1fr 1fr;
}
.g3 {
  grid-template-columns: repeat(3, 1fr);
}
.f {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: var(--mu);
  font-size: 11px;
}
input[type="number"],
select,
.hx {
  background: var(--bg);
  border: 2px solid var(--p2);
  color: var(--tx);
  border-radius: 6px;
  padding: 5px 8px;
  font: inherit;
  width: 100%;
  min-width: 0;
  font-size: 14px;
}
input[type="number"]:focus,
select:focus,
.hx:focus {
  outline: 0;
  border-color: var(--ac);
}
input[type="color"] {
  width: 34px;
  height: 30px;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}
.cc {
  display: flex;
  gap: 6px;
  align-items: center;
  flex: 1;
}
.hx {
  width: 90px;
  text-transform: uppercase;
}
.tabs {
  display: flex;
  gap: 6px;
}
.tabs button {
  flex: 1;
  padding: 6px 4px;
  min-width: 0;
}
.row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 8px 0;
}
.row button {
  padding: 5px 10px;
}
/* Gradient editor */
.gb {
  position: relative;
  height: 26px;
  border-radius: 6px;
  border: 2px solid var(--p2);
  margin: 16px 6px 12px;
  cursor: copy;
}
.gs {
  position: absolute;
  top: -8px;
  width: 14px;
  height: 38px;
  margin-left: -7px;
  border: 2px solid #fff;
  border-radius: 5px;
  box-shadow: 0 1px 4px #000a;
  cursor: ew-resize;
}
.gs.on {
  border-color: var(--ac);
  box-shadow: 0 0 0 2px #000;
}
.pre {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.pre button {
  height: 34px;
  padding: 0;
  border: 2px solid var(--p2);
  color: #fff;
  font-size: 11px;
  text-shadow: 0 1px 2px #000;
}
.pre button:hover {
  border-color: #fcebe9;
  color: #fff;
}
.sw input {
  display: none;
}
.sw i {
  display: block;
  width: 36px;
  height: 20px;
  background: var(--bg);
  border: 2px solid var(--p2);
  border-radius: 10px;
  position: relative;
  cursor: pointer;
}
.sw i:after {
  content: "";
  position: absolute;
  left: 2px;
  top: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--mu);
  transition:
    left 0.3s var(--spring),
    background-color 0.2s;
}
.sw input:checked + i {
  background: var(--ac);
  border-color: var(--ac);
}
.sw input:checked + i:after {
  left: 18px;
  background: var(--btn);
}
.mu {
  color: var(--mu);
}
button,
header .ck {
  white-space: nowrap;
}
aside,
main > * {
  min-width: 0;
}
/* Footer credits */
footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: var(--p);
  border-top: 1px solid var(--p2);
  color: var(--mu);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
}
footer span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
footer b {
  color: #f2f2f2;
  font-family: Quicksand, Poppins, sans-serif;
  font-weight: 700;
}
footer i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--bd);
}
footer svg {
  width: 16px;
  height: 16px;
  fill: #fff;
}
footer img {
  width: 22px;
  height: 22px;
  image-rendering: pixelated;
  transition: transform 0.2s;
}
footer span:hover img {
  animation: hop 0.5s;
}
@keyframes hop {
  40% {
    transform: translateY(-5px);
  }
}
.t2 {
  display: none;
}
a.lk {
  font: inherit;
  background: var(--btn);
  color: var(--ac);
  border: 2px solid var(--btn);
  border-radius: 6px;
  padding: 6px 12px;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  text-decoration: none;
  box-shadow: 0 4px 6px -1px #0003;
  transition:
    color 0.15s,
    background-color 0.15s,
    border-color 0.15s;
  white-space: nowrap;
}
a.lk:hover {
  background: #fcebe9;
  border-color: #fcebe9;
  color: #11080f;
}
/* Animations (Apple-like springs) */
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
@keyframes cvin {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
}
@keyframes rowin {
  from {
    opacity: 0;
    transform: translateX(-14px) scale(0.96);
  }
}
@keyframes rowpop {
  50% {
    transform: scale(1.025);
  }
}
@keyframes rowout {
  to {
    opacity: 0;
    transform: translateX(18px) scale(0.94);
  }
}
button,
a.lk {
  transition:
    color 0.15s,
    background-color 0.15s,
    border-color 0.15s,
    transform 0.28s var(--spring),
    box-shadow 0.2s;
}
button:hover,
a.lk:hover {
  transform: translateY(-1px);
}
button:active,
a.lk:active {
  transform: scale(0.95);
  transition-duration: 0.08s;
}
.ly:active {
  transform: scale(0.985);
}
.ly.new {
  animation: rowin 0.45s var(--spring) backwards;
}
.ly.pop {
  animation: rowpop 0.38s var(--spring);
}
.ly.out {
  animation: rowout 0.17s ease-in forwards;
  pointer-events: none;
}
#pp.in > * {
  animation: rise 0.42s var(--ease) backwards;
}
#pp.in > :nth-child(2) {
  animation-delay: 0.04s;
}
#pp.in > :nth-child(3) {
  animation-delay: 0.08s;
}
#pp.in > :nth-child(4) {
  animation-delay: 0.12s;
}
#pp.in > :nth-child(5) {
  animation-delay: 0.16s;
}
#pp.in > :nth-child(n + 6) {
  animation-delay: 0.2s;
}
.brand,
header > .sp ~ * {
  animation: rise 0.7s var(--ease) backwards;
}
.fl,
.fi {
  display: none;
}
footer .fl {
  color: var(--ac);
  text-decoration: none;
}
footer .fl:hover {
  text-decoration: underline;
}
/* Interactive tutorial: spotlight, card and fake smooth mouse */
#tl [data-act="tour"] {
  margin-top: auto;
}
#tour {
  position: fixed;
  inset: 0;
  z-index: 100;
}
#tour[hidden] {
  display: none;
}
#tHole {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  border-radius: 12px;
  box-shadow: 0 0 0 100vmax rgba(12, 8, 17, 0.7), 0 0 0 2px #ed8678;
  transition: left 0.6s var(--ease), top 0.6s var(--ease), width 0.6s var(--ease), height 0.6s var(--ease);
  pointer-events: none;
}
#tCard {
  position: fixed;
  left: 0;
  top: 0;
  background: var(--p);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 16px 16px 14px;
  box-shadow: 0 20px 50px -10px #000c;
  transition: transform 0.6s var(--spring);
  font-size: 13.5px;
  line-height: 1.5;
}
#tCard.nt {
  transition: none;
}
#tCard h4 {
  margin: 2px 0 6px;
  font: 700 17px Quicksand, Poppins, sans-serif;
  padding-right: 22px;
}
#tCard p {
  margin: 0 0 14px;
  color: #d9cfe6;
}
.tc-step {
  font-size: 11px;
  color: var(--ac);
  font-weight: 600;
  letter-spacing: 0.06em;
}
.tc-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.tc-dots {
  display: flex;
  gap: 4px;
}
.tc-dots i {
  width: 6px;
  height: 6px;
  border-radius: 3px;
  background: var(--bd);
  transition: 0.3s;
}
.tc-dots i.on {
  background: var(--ac);
  width: 16px;
}
.tc-btns {
  display: flex;
  gap: 6px;
}
.tc-x {
  position: absolute;
  right: 8px;
  top: 8px;
  padding: 2px 6px;
  background: none;
  border-color: transparent;
  box-shadow: none;
  color: var(--mu);
}
#tRip {
  position: fixed;
  width: 44px;
  height: 44px;
  margin: -22px 0 0 -22px;
  border-radius: 50%;
  border: 2px solid var(--ac);
  opacity: 0;
  pointer-events: none;
}
#tRip.go {
  animation: ripple 0.65s ease-out;
}
@keyframes ripple {
  from {
    opacity: 0.9;
    transform: scale(0.2);
  }
  to {
    opacity: 0;
    transform: scale(1.6);
  }
}
#tCur {
  position: fixed;
  left: 0;
  top: 0;
  pointer-events: none;
  filter: drop-shadow(0 4px 6px #000a);
  will-change: transform;
}

/* Responsive overrides. They live at the END on purpose: media rules must come after the base rules to win. */
@media (max-width: 1100px) {
  header button span {
    display: none;
  }
  header button {
    padding: 8px 10px;
  }
  .brand {
    font-size: 20px;
  }
  header a.lk span {
    display: none;
  }
  header a.lk {
    padding: 8px 10px;
  }
}
@media (max-width: 760px) {
  body {
    grid-template-rows: 64px 1fr 40px;
  }
  footer {
    gap: 10px;
    font-size: 12px;
  }
  .brand div {
    display: none;
  }
  .brand svg {
    width: 32px;
    height: 32px;
  }
  main {
    grid-template-columns: 52px 1fr;
    grid-template-rows: 1fr 42%;
  }
  aside {
    grid-column: 1/3;
    border-left: 0;
    border-top: 1px solid var(--p2);
    grid-template-rows: minmax(80px, 34%) 1fr;
  }
  #tl {
    padding: 6px;
    gap: 4px;
    overflow-y: auto;
  }
  #tl button {
    width: 38px;
    height: 38px;
  }
  header {
    padding: 0 10px 6px;
    gap: 6px;
  }
  header .ck {
    padding: 6px 8px;
    font-size: 12px;
  }
  .zc {
    bottom: 6px;
  }
  main {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr) 42%;
  }
  aside {
    grid-column: auto;
  }
  #tl {
    flex-direction: row;
    border-right: 0;
    border-bottom: 1px solid var(--p2);
    overflow-x: auto;
    overflow-y: hidden;
    padding: 6px 8px;
    height: 54px;
    justify-content: flex-start;
  }
  #tl button {
    flex: none;
  }
  #tl hr {
    width: 0;
    height: 26px;
    border-top: 0;
    border-left: 1px solid var(--p2);
    margin: 0 2px;
  }
  input[type="number"],
  select,
  .hx {
    font-size: 16px;
  }
  #tl > :first-child {
    margin-left: auto;
  }
  #tl > :last-child {
    margin-right: auto;
  }
}
@media (max-width: 480px) {
  header .ck .t1 {
    display: none;
  }
  header .ck .t2 {
    display: inline;
  }
}
@media (max-width: 420px) {
  #tl {
    gap: 3px;
  }
  #tl button {
    width: 34px;
    height: 34px;
  }
  header {
    gap: 4px;
  }
  header button,
  header a.lk {
    padding: 7px 8px;
  }
  header a.lk {
    display: none;
  }
  footer .fl {
    display: inline;
  }
  footer .fi {
    display: block;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }

<script>
/*
 * Geode Logo Maker — single-file editor.
 *
 * HOW THE PIECES FIT
 *  - Everything is drawn in a fixed 1024x1024 "logo space" (S). Zoom/pan only changes how it is shown.
 *  - Live preview = inline SVG (#fr: frame/ring/background, always crisp) + <canvas id=cv> (imported layers)
 *    + <canvas id=ov> (selection box, handles, guides). The PNG export (render) redraws it all on one canvas.
 *  - State is plain data (see DATA MODEL). renderUi() rebuilds the side panels from it, redraw() the picture.
 *  - Undo/redo = JSON snapshots of that state (pushHistory / restoreSnapshot). Image pixels live outside the
 *    state, in imageStore, and are referenced by key.
 *
 * DATA MODEL
 *  layer  { id, name, k: imageStore key, x, y: centre in logo space, w, h: size, r: rotation (deg),
 *           o: opacity 0-1, v: visible,
 *           st: stroke  { on, t: width, ol: black outline width, c: colour, pos: 'out'|'in', q: quality 1-3 },
 *           sd: shadow  { on, c, o: opacity, x, y: offset, b: blur } }
 *  fill   { mode: 'none'|'solid'|'grad'|'img', color, t: 'linear'|'radial', a: angle (deg), s: [{p: 0-1, c}],
 *           k: imageStore key, fit: 'fit'|'fill'|'stretch'|'center', x, y, sc: scale, r: rotation }
 *  panelFill = the fill INSIDE the frame (what the user calls "background");  ringFill = the gradient ring;
 *  frameOpts.on = frame on/off.  selection = layer id | 'bg' (panelFill) | 'rg' (ringFill) | null.
 */
const $ = (s) => document.querySelector(s),
  $$ = (s) => [...document.querySelectorAll(s)],
  S = 1024,
  PI = Math.PI;
const icon = (d) =>
  `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="${d}"/></svg>`;
$$("[data-ic]").forEach((b) => {
  b.insertAdjacentHTML("afterbegin", icon(b.dataset.ic));
  if (b.title) b.setAttribute("aria-label", b.title);
});
const ICON_EYE =
    "M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z",
  ICON_EYE_OFF =
    "M11.83,9L15,12.16C15,12.11 15,12.05 15,12A3,3 0 0,0 12,9C11.94,9 11.89,9 11.83,9M7.53,9.8L9.08,11.35C9.03,11.56 9,11.77 9,12A3,3 0 0,0 12,15C12.22,15 12.44,14.97 12.65,14.92L14.2,16.47C13.53,16.8 12.79,17 12,17A5,5 0 0,1 7,12C7,11.21 7.2,10.47 7.53,9.8M2,4.27L4.28,6.55L4.73,7C3.08,8.3 1.78,10 1,12C2.73,16.39 7,19.5 12,19.5C13.55,19.5 15.03,19.2 16.38,18.66L16.81,19.08L19.73,22L21,20.73L3.27,3M12,7A5,5 0 0,1 17,12C17,12.64 16.87,13.26 16.64,13.82L19.57,16.75C21.07,15.5 22.27,13.86 23,12C21.27,7.61 17,4.5 12,4.5C10.6,4.5 9.26,4.75 8,5.2L10.17,7.35C10.74,7.13 11.35,7 12,7Z",
  ICON_COPY =
    "M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z",

const GRADIENT_PRESETS = [
  ["Candy", 135, ["#f4a3b5", "#a99ad0", "#7fb4e6"]],
  ["Sunset", 160, ["#7d2339", "#d8454c", "#f08a5f", "#f2d283"]],
  ["Geode", 135, ["#2b2238", "#5b3f7a", "#c8374b"]],
  ["Pastel", 135, ["#f9c6d3", "#a8e6cf", "#c6d8ff", "#fff1a8"]],
  ["Ocean", 135, ["#1d4ed8", "#0d9488", "#10b981"]],
  ["Rose", 90, ["#f87171", "#a78bfa", "#60a5fa"]],
  ["Meadow", 180, ["#c6d8ff", "#b9d58a"]],
];

// ====================================================================================================
// CONSTANTS & SHARED HELPERS (frame geometry, Geometry Dash preset, gradient maths)
// ====================================================================================================
const GD_STROKE = {
    on: true,
    t: 15,
    ol: 20,
    c: "#ffffff",
    pos: "out",
    q: 2,
  },
  GD_SHADOW = {
    on: true,
    c: "#000000",
    o: 0.25,
    x: 36,
    y: 42,
    b: 0,
  };
const FRAME = {
    outer: [20, 195],
    ring: [55, 160],
    panel: [101, 124],
  },
  PANEL_SIZE = S - 2 * 101;
const inset = (p, i) => p.x > i && p.x < S - i && p.y > i && p.y < S - i;
const sortedStops = (f) => [...f.s].sort((a, b) => a.p - b.p);
function gradLine(deg) {
  const a = (deg * PI) / 180,
    dx = Math.sin(a),
    dy = -Math.cos(a),
    k = ((Math.abs(dx) + Math.abs(dy)) * S) / 2;
  return [S / 2 - dx * k, S / 2 - dy * k, S / 2 + dx * k, S / 2 + dy * k];
}
const evenStops = (s) =>
  s.map((c, i) => ({
    p: i / (s.length - 1),
    c,
  }));

// ====================================================================================================
// APPLICATION STATE
// ====================================================================================================
let layers = [],
  selection = null,
  selectedStop = 0,
  activeTool = "v",
  imageStore = {},
  undoStack = [],
  undoIndex = -1,
  nextId = 1,
  view = {
    z: 0.6,
    x: 0,
    y: 0,
  },
  drag = null,
  guides = [],
  spaceHeld = false,
  draggingStop = false,
  draggedLayerId;
const defaultFill = () => ({
  mode: "solid",
  color: "#c8374b",
  t: "linear",
  a: 135,
  s: evenStops(GRADIENT_PRESETS[0][2]),
  k: null,
  fit: "fill",
  x: 0,
  y: 0,
  sc: 1,
  r: 0,
});
let frameOpts = {
    on: 1,
  },
  panelFill = {
    ...defaultFill(),
    mode: "grad",
    a: 33,
    s: [
      {
        p: 0.25,
        c: "#090d0a",
      },
      {
        p: 0.9,
        c: "#3d3a3b",
      },
    ],
  },
  ringFill = {
    mode: "grad",
    color: "#c8374b",
    t: "linear",
    a: 135,
    s: [
      {
        p: 0.1,
        c: "#fbd3d2",
      },
      {
        p: 0.26,
        c: "#f2a5b0",
      },
      {
        p: 0.42,
        c: "#d29dc1",
      },
      {
        p: 0.58,
        c: "#8e8bb7",
      },
      {
        p: 0.7,
        c: "#7ba3d0",
      },
      {
        p: 0.9,
        c: "#7aaad0",
      },
    ],
    k: null,
    fit: "fill",
    x: 0,
    y: 0,
    sc: 1,
    r: 0,
  };
const workspace = $("#ws"),
  layerCanvas = $("#cv"),
  layerCtx = layerCanvas.getContext("2d"),
  currentLayer = () => layers.find((l) => l.id == selection);
const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16) || 0),
  rgbToHex = (a) =>
    "#" +
    a
      .map((v) =>
        Math.round(Math.max(0, Math.min(255, v)))
          .toString(16)
          .padStart(2, "0"),
      )
      .join("");
const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => "&#" + c.charCodeAt(0) + ";");

// ====================================================================================================
// UNDO / REDO HISTORY
// ====================================================================================================
const snapshot = () =>
  JSON.stringify({
    L: layers,
    bg: panelFill,
    rg: ringFill,
    fm: frameOpts,
    sel: selection,

        b = hexToRgb(s[i].c);
      return rgbToHex(a.map((v, j) => v + (b[j] - v) * t));
    }

}

function roundRectPath(i, r) {
  const a = i,
    b = S - i;
  return `M${a + r} ${a}H${b - r}A${r} ${r} 0 0 1 ${b} ${a + r}V${b - r}A${r} ${r} 0 0 1 ${b - r} ${b}H${a + r}A${r} ${r} 0 0 1 ${a} ${b - r}V${a + r}A${r} ${r} 0 0 1 ${a + r} ${a}Z`;
}
const fillImageCache = {};
let frameKey = "";
function frameSvg() {
  const T = $("#tr").checked,
    defs = [],
    body = [];
  const paint = (o, id, box) => {
    if (o.mode == "none") return null;
    if (o.mode == "solid")
      return {
        fill: o.color,
      };
    if (o.mode == "grad") {
      const st = sortedStops(o)
        .map((s) => `<stop offset="${Math.min(1, Math.max(0, s.p))}" stop-color="${s.c}"/>`)
        .join("");
      if (o.t == "radial")
        defs.push(
          `<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="${S * 0.7071}">${st}</radialGradient>`,
        );
      else {
        const [x1, y1, x2, y2] = gradLine(o.a);
        defs.push(
          `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${st}</linearGradient>`,
        );
      }
      return {
        fill: `url(#${id})`,
      };
    }
    const key = JSON.stringify(o) + box,
      e = fillImageCache[id];
    if (!e || e.key != key) {
      const c = makeCanvas(S, S);
      paintBg(c.getContext("2d"), o, box);
      fillImageCache[id] = {
        key,
        url: c.toDataURL("image/png"),
      };
    }
    return {
      img: fillImageCache[id].url,
    };
  };
  const shape = (p, d, rule, cid) => {
    if (!p) return;
    if (p.fill) body.push(`<path fill-rule="${rule}" fill="${p.fill}" d="${d}"/>`);
    else {
      defs.push(`<clipPath id="${cid}"><path clip-rule="${rule}" d="${d}"/></clipPath>`);
      body.push(
        `<image clip-path="url(#${cid})" width="${S}" height="${S}" preserveAspectRatio="none" href="${p.img}"/>`,
      );
    }
  };
  if (frameOpts.on) {
    const P = roundRectPath(...FRAME.panel);
    body.push(
      T
        ? `<path fill-rule="evenodd" fill="#000" d="${roundRectPath(...FRAME.outer)} ${P}"/>`
        : `<path fill="#000" d="${roundRectPath(...FRAME.outer)}"/>`,
    );
    shape(paint(ringFill, "f-gr", S), roundRectPath(...FRAME.ring) + P, "evenodd", "f-cr");
    if (!T) {
      shape(paint(panelFill, "f-gb", PANEL_SIZE), P, "nonzero", "f-cp");
      if (panelFill.mode == "solid") {
        defs.push(
          `<linearGradient id="f-ov" gradientUnits="userSpaceOnUse" x1="0" y1="${FRAME.panel[0]}" x2="0" y2="${S - FRAME.panel[0]}"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".035"/></linearGradient>`,
        );
        body.push(`<path fill="url(#f-ov)" d="${P}"/>`);
      }
    }
  } else if (!T) shape(paint(panelFill, "f-gb", S), `M0 0H${S}V${S}H0Z`, "nonzero", "f-cb");
  return `<defs>${defs.join("")}</defs>${body.join("")}`;
}
function syncFrameSvg() {
  const k = JSON.stringify([panelFill, ringFill, frameOpts, $("#tr").checked]);
  if (k == frameKey) return;
  frameKey = k;
  $("#fr").innerHTML = frameSvg();
}

// ====================================================================================================
// INTERACTIVE TUTORIAL: spotlight + step card + a fake mouse that glides to each control
// ====================================================================================================
// The fake cursor is driven in two layers, like a "smooth camera" in a screen recorder:
//   1. tourAim travels along an eased curve (bezier) towards the target;
//   2. the cursor itself follows tourAim through a damped spring, so it eases in/out and lags a little;
//   its rotation is a second spring that leans the arrow into the direction it is travelling.
var propsAnimTimer;
const TOUR_STEPS = [
  { welcome: true, title: "Welcome to Geode Logo Maker", text: "Build 1024×1024 logos for your Geode mods. This short tour shows every tool: a fake mouse will point things out." },
  { sel: "#tl [data-tool=v]", title: "Select & transform", text: "Click a layer to select it. Drag to move, drag the corners to scale and the round handle to rotate (Shift snaps to 15°, Alt turns snapping off)." },
  { sel: "#tl [data-tool=h]", title: "Pan", text: "Hold Space or use this tool to pan. Scroll the mouse wheel, or pinch on a phone, to zoom." },
  { sel: "#tl [data-act=import]", title: "Import images", text: "Add PNG, JPG or WebP files, or just drop them on the canvas. Every image becomes its own layer." },
  { sel: "#tl [data-act=bg]", title: "Background", text: "The area inside the frame: a solid colour, a fully editable gradient (click the bar to add stops) or your own image." },
  { sel: "#tl [data-act=fm]", title: "Frame ring", text: "The coloured ring has its own fill. You can also turn the whole frame off." },
  { sel: "#tl [data-act=ctr]", title: "Perfect centering", text: "Centres the visible pixels of the selected layer, ignoring transparent padding. “Fit layer to canvas” is the button next to it." },
  { sel: "#ll", at: "tl", title: "Layers", text: "Click to select, drag to reorder, double-click to rename. The eye hides a layer, the copy icon duplicates it and the bin deletes it." },
  { sel: "#pp", at: "tl", title: "Properties", text: "Exact position, size, rotation and opacity, plus the “Geometry Dash style” button: black outline, white stroke and the soft shadow in one click." },
  { sel: ".zc", title: "Zoom & sound", text: "Zoom in and out, fit the canvas or jump to 100%. The speaker icon mutes the interface sounds." },
  { sel: "header .ck", title: "Transparent background", text: "Hides the inside of the frame, so the exported PNG is transparent there." },
  { sel: "#ex", title: "Export", text: "Saves a 1024×1024 PNG exactly as you see it." },
  { welcome: true, last: true, title: "You're ready!", text: "Shortcuts: Ctrl+Z / Ctrl+Shift+Z undo and redo · Ctrl+D duplicate · Delete remove · arrow keys nudge · V / H tools · 0 fit view. Press ? or the help button to replay this tour." },
];
const tourState = { i: -1, on: false };
const tourPhys = { x: 0, y: 0, vx: 0, vy: 0, r: 0, vr: 0, s: 1, vs: 0, st: 1 }; // cursor position, rotation, click squish
const tourAim = { x: 0, y: 0 };
let tourPath = null, tourRaf = 0, tourLast = 0, tourEl, tourHole, tourCard, tourCursor, tourRip;

function buildTour() {
  tourEl = document.createElement("div");
  tourEl.id = "tour";
  tourEl.innerHTML =
    '<div id="tHole"></div><div id="tCard" role="dialog" aria-live="polite"></div><div id="tRip"></div>' +
    '<svg id="tCur" width="34" height="34" viewBox="0 0 24 24"><path d="M13.64,21.97C13.14,22.21 12.54,22 12.31,21.5L10.13,16.76L7.62,18.78C7.45,18.92 7.24,19 7,19A1,1 0 0,1 6,18V3A1,1 0 0,1 7,2C7.24,2 7.47,2.09 7.64,2.23L7.65,2.22L19.14,11.86C19.57,12.22 19.62,12.85 19.27,13.27C19.12,13.45 18.91,13.57 18.7,13.61L15.54,14.23L17.74,18.96C18,19.46 17.76,20.05 17.26,20.28L13.64,21.97Z" fill="#ed8678" stroke="#160503" stroke-width="1.1" stroke-linejoin="round" paint-order="stroke"/></svg>';
  document.body.appendChild(tourEl);
  tourHole = $("#tHole");
  tourCard = $("#tCard");
  tourCursor = $("#tCur");
  tourRip = $("#tRip");
  tourCard.addEventListener("click", (e) => {
    const b = e.target.closest("[data-t]");
    if (!b) return;
    if (b.dataset.t == "next") tourGo(tourState.i + 1, 1);
    else if (b.dataset.t == "back") tourGo(tourState.i - 1, -1);
    else endTour();
  });
}

function tourTargetRect(step) {
  if (!step.sel) return null;
  const el = document.querySelector(step.sel);
  if (!el) return null;
  if (el.scrollIntoView) el.scrollIntoView({ block: "nearest", inline: "nearest" });
  const r = el.getBoundingClientRect();
  return r.width < 2 || r.height < 2 ? null : r; // hidden on this screen size -> skip the step
}

function placeTourCard(r) {
  const W = Math.min(320, innerWidth - 24);
  tourCard.style.width = W + "px";
  const H = tourCard.offsetHeight || 190, gap = 16;
  let x = (innerWidth - W) / 2, y = (innerHeight - H) / 2;
  if (r) {
    const spots = [[r.right + gap, r.top], [r.left - W - gap, r.top], [r.left, r.bottom + gap], [r.left, r.top - H - gap]];
    const fits = ([sx, sy]) => sx >= 8 && sx + W <= innerWidth - 8 && sy >= 8 && sy + H <= innerHeight - 8;
    [x, y] = spots.find(fits) || [(innerWidth - W) / 2, innerHeight - H - 16];
  }
  x = Math.max(8, Math.min(innerWidth - W - 8, x));
  y = Math.max(8, Math.min(innerHeight - H - 8, y));
  tourCard.style.transform = `translate(${x}px,${y}px)`;
}

function tourGo(i, dir = 1) {
  while (i >= 0 && i < TOUR_STEPS.length && TOUR_STEPS[i].sel && !tourTargetRect(TOUR_STEPS[i])) i += dir;
  if (i >= TOUR_STEPS.length) return endTour();
  if (i < 0) i = 0;
  tourState.i = i;
  const st = TOUR_STEPS[i], r = tourTargetRect(st), n = TOUR_STEPS.length;
  tourCard.innerHTML =
    `<button class="tc-x" data-t="skip" aria-label="Close tutorial">✕</button><div class="tc-step">${i + 1} / ${n}</div>` +
    `<h4>${st.title}</h4><p>${st.text}</p><div class="tc-row"><div class="tc-dots">${TOUR_STEPS.map((_, k) => `<i class="${k == i ? "on" : ""}"></i>`).join("")}</div>` +
    `<div class="tc-btns">${i > 0 && !st.last ? '<button data-t="back">Back</button>' : ""}<button class="pr" data-t="next">${i == 0 ? "Start tour" : st.last ? "Done" : "Next"}</button></div></div>`;
  if (r) {
    const pad = 6;
    Object.assign(tourHole.style, { left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
  } else Object.assign(tourHole.style, { left: "50%", top: "50%", width: "0px", height: "0px" });
  placeTourCard(r);
  if (r) {
    const big = st.at == "tl"; // big panels: point at their top-left area instead of the middle
    const tx = big ? r.left + Math.min(80, r.width / 2) : r.left + r.width / 2;
    const ty = big ? r.top + Math.min(60, r.height / 2) : r.top + r.height / 2;
    humanMove(tx, ty, Math.min(r.width, r.height), tourClick);
  } else startTourPath(innerWidth * 0.62, innerHeight * 0.68);
  SND.tap();
}

function startTourPath(tx, ty, done, opt = {}) {
  const a = { x: tourPhys.x, y: tourPhys.y }, dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy) || 1;
  // curved arc whose side and size change every time, like a real hand
  const bend = opt.bend ?? Math.min(120, dist * 0.22) * (Math.random() < 0.5 ? 1 : -1) * (0.6 + Math.random() * 0.8);
  const c = { x: (a.x + tx) / 2 - (dy / dist) * bend, y: (a.y + ty) / 2 + (dx / dist) * bend };
  tourPath = {
    a, c, b: { x: tx, y: ty },
    t0: performance.now() + (opt.delay ?? 200 + Math.random() * 200),
    d: opt.d ?? Math.max(650, dist * 1.1 + 350) * (0.85 + Math.random() * 0.3), // slightly different speed each time
    done,
  };
}

// Humans never land exactly on the target: first they miss by a few pixels, then make a tiny correction,
// and the click still happens at least 3px away from the exact centre. (Both misses point the same way, so
// the correction never passes through the perfect centre.)
function humanMove(tx, ty, minDim, done) {
  const ang = Math.random() * Math.PI * 2, m2 = 3.5 + Math.random() * 2.5;
  const m1 = Math.min(Math.max(m2 + 2.5, 6 + Math.random() * 6), Math.max(m2 + 2.5, minDim * 0.3));
  const ang2 = ang + (0.3 + Math.random() * 0.7) * (Math.random() < 0.5 ? 1 : -1);
  startTourPath(tx + Math.cos(ang) * m1, ty + Math.sin(ang) * m1, () =>
    startTourPath(tx + Math.cos(ang2) * m2, ty + Math.sin(ang2) * m2, done, { d: 260 + Math.random() * 140, delay: 60 + Math.random() * 120, bend: 0 }),
  );
}

// Hand tremor: overlapping slow/fast sine waves with random phases (smooth, never visibly repeating).
// The caller scales it by the cursor speed, so it only shows while moving.
const tourSeed = Array.from({ length: 6 }, () => Math.random() * 6.28);
function handShake(now) {
  const t = now / 1000, s = tourSeed;
  return {
    x: Math.sin(t * 9.1 + s[0]) * 0.55 + Math.sin(t * 13.7 + s[1]) * 0.35 + Math.sin(t * 1.7 + s[2]) * 1.2,
    y: Math.sin(t * 8.3 + s[3]) * 0.55 + Math.sin(t * 12.9 + s[4]) * 0.35 + Math.sin(t * 1.3 + s[5]) * 1.2,
  };
}

function tourClick() {
  tourPhys.st = 0.78; // squish the cursor, then let the spring bring it back
  setTimeout(() => (tourPhys.st = 1), 130);
  tourRip.style.left = tourPhys.x + "px";
  tourRip.style.top = tourPhys.y + "px";
  tourRip.classList.remove("go");
  void tourRip.offsetWidth;
  tourRip.classList.add("go");
  SND.tap();
}

function tourFrame(now) {
  if (!tourState.on) return;
  const dt = Math.min(0.04, (now - tourLast) / 1000 || 0.016), p = tourPhys;
  tourLast = now;
  if (tourPath) {
    const t = Math.max(0, Math.min(1, (now - tourPath.t0) / tourPath.d)),
      e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, // ease in-out cubic
      u = 1 - e, { a, c, b } = tourPath;
    tourAim.x = u * u * a.x + 2 * u * e * c.x + e * e * b.x;
    tourAim.y = u * u * a.y + 2 * u * e * c.y + e * e * b.y;
    if (t >= 1 && tourPath.done) { const f = tourPath.done; tourPath.done = null; f(); }
  }
  const K = 120, C = 2 * Math.sqrt(K) * 0.9; // position spring (slightly under-damped = soft landing)
  p.vx += ((tourAim.x - p.x) * K - p.vx * C) * dt;
  p.vy += ((tourAim.y - p.y) * K - p.vy * C) * dt;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  const lean = Math.max(-30, Math.min(30, p.vx * 0.035 + p.vy * 0.012)), KR = 140, CR = 2 * Math.sqrt(KR) * 0.7;
  p.vr += ((lean - p.r) * KR - p.vr * CR) * dt;
  p.r += p.vr * dt;
  p.vs += ((p.st - p.s) * 300 - p.vs * 26) * dt;
  p.s += p.vs * dt;
  // Tremor only exists while the hand is MOVING: it grows with speed and fades to exactly zero when the cursor rests.
  const speed = Math.hypot(p.vx, p.vy), k = Math.min(1, speed / 300) ** 0.8;
  const sh = handShake(now), ux = p.vx / (speed || 1), uy = p.vy / (speed || 1);
  const wob = Math.sin((now / 1000) * 11 + tourSeed[0]) * 1.8 * k; // wobble sideways, perpendicular to the direction of travel
  const jx = sh.x * 1.4 * k - uy * wob, jy = sh.y * 1.4 * k + ux * wob;
  tourCursor.style.transform = `translate(${p.x + jx}px,${p.y + jy}px) rotate(${p.r + jx * 0.6}deg) scale(${p.s}) translate(-9.2px,-3.5px)`;
  tourRaf = requestAnimationFrame(tourFrame);
}

function startTour() {
  if (!tourEl) buildTour();
  tourEl.hidden = false;
  tourState.on = true;
  Object.assign(tourPhys, { x: innerWidth * 0.8, y: innerHeight * 0.85, vx: 0, vy: 0, r: 0, vr: 0, s: 1, vs: 0, st: 1 });
  Object.assign(tourAim, { x: tourPhys.x, y: tourPhys.y });
  tourCard.classList.add("nt");
  tourGo(0);
  void tourCard.offsetWidth;
  tourCard.classList.remove("nt");
  tourLast = performance.now();
  cancelAnimationFrame(tourRaf);
  tourRaf = requestAnimationFrame(tourFrame);
}

function endTour() {
  tourState.on = false;
  cancelAnimationFrame(tourRaf);
  if (tourEl) tourEl.hidden = true;
  try { localStorage.setItem("gtour", "1"); } catch {}
}

$("[data-act=tour]").onclick = startTour;
addEventListener("resize", () => tourState.on && tourGo(tourState.i, 1));
// While the tour is open it owns the keyboard (capture phase + stopImmediatePropagation keeps editor shortcuts quiet)
addEventListener("keydown", (e) => {
  if (!tourState.on) {
    if (e.key == "?" && !e.target.matches?.("input,select,[contenteditable=true]")) startTour();
    return;
  }
  e.preventDefault();
  e.stopImmediatePropagation();
  if (e.key == "Escape") endTour();
  else if (e.key == "ArrowRight" || e.key == "Enter" || e.key == " ") tourGo(tourState.i + 1, 1);
  else if (e.key == "ArrowLeft") tourGo(tourState.i - 1, -1);
}, true);
// First visit: offer the tour once
try { if (localStorage.getItem("gtour") !== "1") setTimeout(() => tourState.on || startTour(), 1200); } catch {}

// ====================================================================================================
// KEYBOARD SHORTCUTS + BOOT
// ====================================================================================================
addEventListener("keydown", (e) => {
  if (e.target.matches?.("input,select,[contenteditable=true]")) return;
  const m = e.ctrlKey || e.metaKey,
    k = e.key.toLowerCase(),
    l = currentLayer();
  if (e.code == "Space" && !e.target.closest?.("button,a")) {
    spaceHeld = true;
    e.preventDefault();
    return;
  }
  if (m && k == "z") {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  } else if (m && k == "y") {
    e.preventDefault();
    redo();
  } else if (m && k == "d") {
    e.preventDefault();
    l && duplicateLayer(l);
  } else if (k == "delete" || k == "backspace") {
    l && deleteLayer(l);
  } else if (k == "v" && !m) {
    activeTool = "v";
    renderUi();
  } else if (k == "h" && !m) {
    activeTool = "h";
    renderUi();
  } else if (k == "0") {
    fitView();
  } else if (k == "+" || k == "=") {
    zoomAt(1.25, workspace.clientWidth / 2, workspace.clientHeight / 2);
  } else if (k == "-") {
    zoomAt(0.8, workspace.clientWidth / 2, workspace.clientHeight / 2);
  } else if (l && k.startsWith("arrow")) {
    e.preventDefault();
    const d = e.shiftKey ? 10 : 1;
    if (k == "arrowleft") l.x -= d;
    if (k == "arrowright") l.x += d;
    if (k == "arrowup") l.y -= d;
    if (k == "arrowdown") l.y += d;
    pushHistory();
    redraw();
    syncInputs();
  }
});
addEventListener("keyup", (e) => {
  if (e.code == "Space") spaceHeld = false;
});
addEventListener("blur", () => {
  spaceHeld = false;
});
new ResizeObserver(() => (userMovedView ? layoutView() : fitView())).observe(workspace);
if (matchMedia("(prefers-reduced-motion:reduce)").matches) $("header svg").pauseAnimations?.();
pushHistory();
fitView();
renderUi();
